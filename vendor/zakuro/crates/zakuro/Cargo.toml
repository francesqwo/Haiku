[package]
name = "zakuro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A high-level-emulation Nintendo 3DS emulator"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zakuro"
path = "src/main.rs"

[features]
# cpu: see zakuro-core's strip-interpreter
strip-interpreter = ["zakuro-core/strip-interpreter"]
# native-final: see zakuro-core's pure and emulation; without emulation
# there is no Compatibility renderer
pure = ["strip-interpreter", "zakuro-core/pure"]
emulation = ["zakuro-core/emulation"]

[dependencies]
zakuro-common.workspace = true
zakuro-core.workspace = true
zakuro-fs.workspace = true
# native-final: no emulated rasterizer or shader JIT unless `emulation`
zakuro-gpu = { path = "../zakuro-gpu", default-features = false, features = ["opengl", "vulkan"] }
log.workspace = true
env_logger = "0.11"
winit = { version = "0.30", features = ["serde"] }
raw-window-handle = "0.6"
glutin = "0.32"
glutin-winit = "0.5"
cpal = "0.16"
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "wayland", "x11"] }
ab_glyph = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
# ui: the Fates font's glyph metrics
serde_json = "1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
recomp3ds = { git = "https://github.com/fearkov/3dsrecomp" }
sha2 = "0.10"
gilrs = { version = "0.11.2", features = ["serde-serialize"] }
# mods: unpacking zipped mods (already in the lock through png)
miniz_oxide = "0.8"
# hdpacks: unpacking large downloads as they are read (already in the lock)
flate2 = "1"

[dev-dependencies]
zakuro-fs = { workspace = true, features = ["testing"] }

# the computer's camera, for the console's, with the frames turned into
# pictures here rather than by its C decoder
[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-v4l"] }

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-avfoundation"] }
