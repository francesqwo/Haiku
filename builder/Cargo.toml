# Haiku's setup: installs the game from the player's own dump and builds
# the game's code module (data/code/game.dll) there. oneexe: a library in
# Haiku.exe (source/), which opens its window when it is needed; it was
# Haiku Setup.exe up to 1.1. The release ships Haiku.exe, a small GCC and
# the recipes for Haiku's game-derived files, and no game code; see
# dev/reports/oneexe.md and dev/builder/package.sh.

[package]
name = "haiku-setup"
version = "0.1.0"
edition = "2021"
publish = false
build = false

[lib]
name = "haiku_setup"
path = "src/lib.rs"

[dependencies]
# the recompiler, as a library: it writes the game's code as C and compiles it
recomp3ds = { path = "../vendor/3dsrecomp" }
# the installer Haiku.exe --install uses (data/ from the dump)
zakuro-fs = { path = "../vendor/zakuro/crates/zakuro-fs" }
sha2 = "0.10"
png = "0.18"
miniz_oxide = "0.8"

# a project of its own, whatever directory it sits in
[workspace]

[profile.release]
debug = 0
